<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>青杉生活超市 · 新店开业筹备数智化平台（Demo）</title>
<style>
  :root{
    --navy:#15315E; --blue:#2F6FED; --blue-soft:#eef3fb; --ink:#1f2a37;
    --green:#16a34a; --amber:#f59e0b; --red:#dc2626; --gray:#94a3b8;
    --line:#b8c4d6; --bg:#f6f8fc; --card:#fff;
    --shadow:0 1px 3px rgba(21,49,94,.08),0 6px 18px rgba(21,49,94,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.55;}
  header.top{background:linear-gradient(120deg,var(--navy),#1d3f73);color:#fff;padding:16px 22px;}
  header.top h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.5px}
  header.top .sub{font-size:12.5px;opacity:.82;margin-top:3px}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;margin-left:8px;
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);vertical-align:middle}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 60px}
  /* store switch */
  .stores{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
  .store-btn{flex:1;min-width:200px;background:var(--card);border:1.5px solid var(--line);
    border-radius:12px;padding:11px 14px;cursor:pointer;text-align:left;transition:.15s;box-shadow:var(--shadow)}
  .store-btn:hover{border-color:var(--blue)}
  .store-btn.active{border-color:var(--blue);background:var(--blue-soft)}
  .store-btn .nm{font-weight:700;font-size:14.5px;color:var(--navy)}
  .store-btn .st{font-size:11.5px;color:var(--gray);margin-top:2px}
  .store-btn .tag{font-size:11px;font-weight:700;float:right;padding:1px 8px;border-radius:6px}
  .tag.ok{background:#e7f6ec;color:var(--green)}
  .tag.risk{background:#fdeaea;color:var(--red)}
  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .kpi{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .lab{font-size:12px;color:var(--gray)}
  .kpi .val{font-size:26px;font-weight:800;color:var(--navy);margin-top:4px}
  .kpi .delta{font-size:11.5px;margin-top:2px}
  .kpi .bar{height:6px;border-radius:4px;background:#eef1f6;margin-top:10px;overflow:hidden}
  .kpi .bar > i{display:block;height:100%;border-radius:4px}
  .up{color:var(--red)} .down{color:var(--green)}
  /* tabs */
  .tabs{display:flex;gap:6px;border-bottom:2px solid #e4e9f2;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:9px 16px;cursor:pointer;font-size:14px;color:var(--gray);border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:600}
  .tab:hover{color:var(--blue)}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue)}
  .panel{display:none;animation:fade .2s}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  /* dashboard */
  .groups{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .gcol{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:12px}
  .gcol h3{margin:2px 0 10px;font-size:14px;color:var(--navy);display:flex;align-items:center;gap:8px}
  .gcol h3 .dot{width:9px;height:9px;border-radius:50%}
  .task{border:1px solid #e7ecf4;border-radius:9px;padding:9px 10px;margin-bottom:9px;cursor:pointer;transition:.15s;background:#fff}
  .task:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(47,111,237,.12)}
  .task .tn{font-size:13px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;gap:6px}
  .task .code{font-size:10.5px;color:var(--gray);font-family:ui-monospace,Menlo,Consolas,monospace}
  .task .meta{font-size:11px;color:var(--gray);margin-top:4px;display:flex;justify-content:space-between}
  .st-badge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap}
  .s-done{background:#e7f6ec;color:var(--green)} .s-prog{background:#fff4e0;color:#b9740a}
  .s-over{background:#fdeaea;color:var(--red)} .s-block{background:#fdeaea;color:var(--red);border:1px solid #f3b5b5}
  .s-pend{background:#eef1f6;color:#64748b}
  .prog{height:5px;background:#eef1f6;border-radius:3px;margin-top:6px;overflow:hidden}
  .prog > i{display:block;height:100%}
  .gate-flag{font-size:9.5px;color:var(--red);font-weight:700;margin-left:5px;border:1px solid #f3b5b5;border-radius:4px;padding:0 4px}
  /* graph */
  .graph-card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px}
  svg{width:100%;height:auto;display:block}
  .gnode rect{rx:9}
  .gnode text{font-size:11px;font-weight:600;fill:#fff;dominant-baseline:middle}
  .gnode .code{font-size:8.5px;fill:rgba(255,255,255,.85);font-weight:400}
  .edge{stroke:#9fb0c8;stroke-width:1.6;fill:none}
  .edge.crit{stroke:var(--red);stroke-width:2.4}
  .edge-label{font-size:9px;fill:#64748b;font-family:ui-monospace,monospace}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--gray);margin-top:8px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  /* alerts */
  .alert{display:flex;gap:12px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);
    padding:12px 14px;margin-bottom:10px;border-left:4px solid var(--amber)}
  .alert.red{border-left-color:var(--red)}
  .alert.green{border-left-color:var(--green)}
  .alert .ic{font-size:20px;line-height:1}
  .alert .hd{font-weight:700;font-size:13.5px;color:var(--navy)}
  .alert .bd{font-size:12.5px;color:#475569;margin-top:2px}
  .alert .tm{font-size:11px;color:var(--gray);margin-top:3px}
  /* safety */
  .safe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .safe-card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px;border-top:4px solid var(--red)}
  .safe-card h3{margin:0 0 4px;font-size:14.5px;color:var(--navy)}
  .safe-card .desc{font-size:11.5px;color:var(--gray);margin-bottom:10px}
  .chk{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed #eef1f6;font-size:13px}
  .chk:last-child{border-bottom:none}
  .chk input{width:17px;height:17px;accent-color:var(--red)}
  .chk .ok{color:var(--green);font-weight:700;font-size:11px;margin-left:auto}
  .chk .no{color:var(--red);font-weight:700;font-size:11px;margin-left:auto}
  .gate-banner{background:linear-gradient(120deg,#fdeaea,#fff);border:1.5px solid #f3b5b5;border-radius:10px;
    padding:13px 15px;margin-top:14px;color:#7f1d1d;font-size:13px;display:flex;gap:10px;align-items:flex-start}
  .gate-banner b{color:var(--red)}
  /* modal */
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50}
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:440px;width:90%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:fade .2s}
  .modal h3{margin:0 0 8px;color:var(--navy);font-size:16px}
  .modal p{font-size:13px;color:#475569;margin:6px 0}
  .modal .row{display:flex;gap:10px;margin-top:16px}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:600}
  .btn.ghost{background:#eef1f6;color:var(--ink)}
  .btn:hover{filter:brightness(1.05)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;
    padding:11px 20px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .sim-btn{background:#fff;border:1.5px solid var(--red);color:var(--red);border-radius:9px;padding:8px 14px;
    font-size:13px;font-weight:700;cursor:pointer}
  .sim-btn:hover{background:#fdeaea}
  .note{font-size:11.5px;color:var(--gray)}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.groups,.safe-grid{grid-template-columns:1fr}}
</style>
</head>

    </div>
    <button class="sim-btn" id="simBtn">⚠ 模拟典型事故</button>
  </div>

  <!-- DASHBOARD -->

  <!-- GRAPH -->

      </div>
      <div class="note" id="graphNote" style="margin-top:10px"></div>
    </div>
  </div>

  <!-- ALERTS -->
  <div class="panel" id="p-alert"><div id="alerts"></div></div>

  <!-- SAFETY -->
  <div class="panel" id="p-safe">
    <div class="safe-grid" id="safeGrid"></div>
    <div class="gate-banner" id="gateBanner"></div>
  </div>
</div>

<!-- modal -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3 id="mTitle">提示</h3>
    <div id="mBody"></div>
    <div class="row">
      <button class="btn" id="mOk">知道了</button>

  </div>
</div>
<div class="toast" id="toast"></div>

function $(id){return document.getElementById(id);}

function computeKPI(s){
  const tasks=s.tasks;
  const total=tasks.length;
  const overdue=tasks.filter(t=>t.status==='over'||t.status==='block').length;
  const delayRate=Math.round(overdue/total*100);
  const leaks=tasks.filter(t=>t.gate && !t.ac).length; // 安全闸门未验收
  const done=tasks.filter(t=>t.status==='done').length;
  const compRate=Math.round(done/total*100);
  return {total,overdue,delayRate,leaks,compRate};
}

function renderKPI(){
  const s=STORES[CUR]; const k=computeKPI(s);
  const cards=[
    {lab:'新店延期率（目标 ≤15%）',val:k.delayRate+'%',delta:`基线 32% ↓ ${32-k.delayRate}pt`,
      bar:k.delayRate,color:k.delayRate<=15?'var(--green)':'var(--red)',cls:k.delayRate<=15?'down':'up'},
    {lab:'筹备漏项（目标 <3 项）',val:k.leaks+' 项',delta:k.leaks<3?'达标 ✓':'超阈值',
      bar:Math.min(k.leaks*20,100),color:k.leaks<3?'var(--green)':'var(--red)',cls:k.leaks<3?'down':'up'},
    {lab:'关键依赖识别完整率',val:'95%',delta:'AI 引擎自动识别 ≥95%',

}

function renderGraph(){
  const s=STORES[CUR]; const g=s.graph;
  const W=920,H=460, colW=180, rowH=120, x0=40, y0=50, bw=148, bh=50;
  const pos={};
  g.nodes.forEach(n=>{ pos[n.id]={x:x0+n.col*colW, y:y0+n.row*rowH, ...n}; });
  let edgesSvg='';
  g.edges.forEach(e=>{
    const a=pos[e.f], b=pos[e.t];
    const x1=a.x+bw, y1=a.y+bh/2, x2=b.x, y2=b.y+bh/2;
    const mx=(x1+x2)/2;
    const dash=e.gate?'stroke-dasharray="6 4"':'';
    const cls=e.crit?'edge crit':(e.gate?'edge gate':'edge');
    edgesSvg+=`<path class="${cls}" ${dash} d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" marker-end="url(#ar${e.crit?'C':(e.gate?'G':'N')})"/>`;
  });
  let nodesSvg='';
  g.nodes.forEach(n=>{
    const sm=ST_META[n.st]; const c=sm.c;
    const gateRing=n.gate?'stroke:#dc2626;stroke-width:2.4':'stroke:rgba(0,0,0,.08)';
    nodesSvg+=`<g class="gnode" transform="translate(${n.x},${n.y})" style="cursor:pointer" onclick="showTask('${n.c}')">
      <rect width="${bw}" height="${bh}" rx="9" fill="${c}" style="${gateRing}"></rect>
      <text x="12" y="20">${n.t}</text>
      <text class="code" x="12" y="38">${n.c}</text>
    </g>`;
  });
  const svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arN" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9fb0c8"/></marker>
      <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
      <marker id="arC" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
    </defs>
    ${edgesSvg}${nodesSvg}
  </svg>`;
  $('graphHost').innerHTML=svg;
  $('graphNote').textContent='图谱解读：'+s.note+' 红色粗线=关键路径阻塞；红色虚线=安全闸门依赖（消防/用电）。点击节点查看任务详情。';
}

      out.push({ic:'🚫',cls:'red',hd:`安全闸门拦截：${t.name}（${t.code}）`,

    <h3>🚪 开业综合闸门</h3>
    <div class="desc">所有安全闸门项 + 关键路径达标，方可开门营业</div>

    <div class="chk"><input type="checkbox" ${allGateOk?'checked':''} disabled>

    : `<b>🚫 安全闸门拦截（不可代签）：</b> 检测到未验收的安全闸门项（消防/用电），系统<b>拒绝</b>开门与生鲜入库，并强制转人工兜底。AI 仅做提醒，绝不代签验收——对应报告 §2.5 红线。`;
  $('gateBanner').innerHTML=`<span style="font-size:20px">${allGateOk?'✅':'🛡'}</span><div>${banner}</div>`;

function showTask(code){
  const s=STORES[CUR]; const t=s.tasks.find(x=>x.code===code);
  if(!t) return;
  const sm=ST_META[t.status];
  let dep=s.graph.edges.filter(e=>{
    const n=s.graph.nodes.find(x=>x.id===e.t);
    return n && n.c===code;
  }).map(e=>{const f=s.graph.nodes.find(x=>x.id===e.f);return f?f.t:'?';});
  const html=`
    <p><b>业务编号：</b><span style="font-family:ui-monospace,monospace">${t.code}</span>
       ${t.gate?'<span style="color:var(--red);font-weight:700"> · 安全闸门项</span>':''}</p>
    <p><b>当前状态：</b><span style="color:${sm.c};font-weight:700">${sm.t}</span> · 进度 ${t.prog}%</p>
    <p><b>所属群 / 负责人：</b>${GROUP_META[t.group].label} / ${t.owner}</p>
    <p><b>计划验收：</b>${t.plan}${t.ac?(' · <b style="color:var(--green)">已验收 '+t.ac+'</b>'):' · <b style="color:var(--red)">尚未验收</b>'}
       ${t.up?(' · 上传 '+t.up):''}</p>
    ${dep.length?`<p><b>前置依赖：</b>${dep.join('、')}</p>`:''}
    ${t.note?`<p style="background:#f6f8fc;padding:8px 10px;border-radius:8px">${t.note}</p>`:''}
    <p class="note">审计留痕：业务编号 / 资料版本 / 事实引用 / 建议结果 / 人工改动 / 签核人 —— 全程可追溯（只读试点，AI 不代签）。</p>`;
  openModal(t.name, html);
}

function openModal(title,body){
  $('mTitle').textContent=title; $('mBody').innerHTML=body;
  $('modalMask').classList.add('show');
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}
